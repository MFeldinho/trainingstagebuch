<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eceff1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trainingstagebuch">
  <title>Trainingstagebuch</title>
  <meta name="description" content="Krafttraining protokollieren und als Markdown sichern. Läuft offline im Browser, ohne Konto.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Trainingstagebuch</h1>
      <p id="export-status" class="badge warn" role="status">Nicht exportiert</p>
    </header>
    <p id="storage-hint" class="hint" hidden></p>
    <main id="main"></main>
  </div>
  <div class="toast-wrap">
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <nav class="tabbar" aria-label="Bereiche">
    <button type="button" data-tab="session">Session</button>
    <button type="button" data-tab="exercises">Übungen</button>
    <button type="button" data-tab="templates">Vorlagen</button>
    <button type="button" data-tab="history">Verlauf</button>
    <button type="button" data-tab="data">Daten</button>
  </nav>
  <noscript>
    <p class="noscript">Diese App braucht JavaScript. Es werden keine Daten an einen Server gesendet.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
